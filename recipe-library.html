<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A-Z Recipe Library | Siena's Kitchen</title>
    <meta
      name="description"
      content="A complete A-Z recipe library with an expanded, step-by-step view for every recipe."
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./footer-style.css" />
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
    <script src="./recipe-cuisines.js" defer></script>
    <script src="./recipe-library.js" defer></script>
    <script src="./footer.js" defer></script>
  </head>
  <body data-page="library">
    <aside class="ad-rail ad-rail--left" data-ad-rail="leftRail" aria-label="Advertisement">
      <span class="ad-rail__label">Advertisement</span>
    </aside>
    <aside class="ad-rail ad-rail--right" data-ad-rail="rightRail" aria-label="Advertisement">
      <span class="ad-rail__label">Advertisement</span>
    </aside>
    <div class="page-shell">
      <header class="site-header">
        <button class="header-menu-toggle" type="button" data-menu-toggle aria-label="Open navigation menu" aria-expanded="false" aria-controls="navigationDrawer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg></button>
        <div class="brand-lockup">
          <div class="brand-title">
            <img
              class="brand-logo"
              src="./assets/siena-profile.jpg"
              alt="Siena"
            />
            <a href="./index.html" class="brand-name">Siena's Kitchen</a>
          </div>
          <a
            class="brand-handle"
            href="https://instagram.com/sienaskitchen"
            target="_blank"
            rel="noreferrer"
          >
            <span class="brand-handle-icon" aria-hidden="true">
              <i data-lucide="instagram"></i>
            </span>
            @sienaskitchen
          </a>
        </div>
      </header>

      <main>
        <a class="journal-back" href="./index.html" aria-label="Back to main page">&larr;</a>
<section class="az-library">
          <div class="section-heading">
            <div>
              <p class="section-kicker">A-Z recipe library</p>
              <h2>Browse every recipe</h2>
            </div>
          </div>

          <div class="az-layout">
            <div class="az-panel">
              <label class="search-field az-search">
                <span class="sr-only">Search recipes</span>
                <input
                  id="azSearchInput"
                  type="search"
                  placeholder="Search by title, ingredient, or tag"
                  autocomplete="off"
                />
              </label>
              <label class="filter-field az-filter">
                <span class="sr-only">Filter by series</span>
                <select id="azSeriesFilter">
                  <option value="all">All series</option>
                  <option value="junk-food-rebuilt">Junk Food, Rebuilt</option>
                  <option value="meal-prep">Meal prep</option>
                  <option value="baked-favourites">Baking</option>
                  <option value="asian-dishes">Asian dishes</option>
                  <option value="breakfast">Breakfasts</option>
                  <option value="dinner">Dinners</option>
                  <option value="budget-meals">Budget meals</option>
                </select>
              </label>
              <div id="azSuggestions" class="az-suggestions" role="listbox" hidden></div>

              <div class="az-list-shell">
                <div id="azListScroll" class="az-list-scroll" tabindex="0">
                  <div id="azList" class="az-list" role="list"></div>
                </div>
                <div id="azScrollbar" class="az-scrollbar" aria-hidden="true">
                  <div class="az-scrollbar-track"></div>
                  <button id="azScrollThumb" class="az-scrollbar-thumb" type="button">
                    <span id="azScrollLetter" class="az-scrollbar-letter">A</span>
                  </button>
                </div>
              </div>
            </div>

            <div class="az-detail">
              <div id="azRecipeView" aria-live="polite"></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-brand">
          <p class="eyebrow">Sunday Table</p>
          <strong class="footer-title">Siena's Kitchen</strong>
          <div class="footer-stickers" aria-hidden="true">
            <img class="sticker-img" src="./assets/stickers/page1-01.png" alt="" />
            <img class="sticker-img" src="./assets/stickers/page2-03.png" alt="" />
            <img class="sticker-img" src="./assets/stickers/page2-01.png" alt="" />
            <img class="sticker-img" src="./assets/stickers/page1-08.png" alt="" />
          </div>
        </div>
        <div class="footer-links">
          <p class="footer-title">Follow</p>
          <a href="https://instagram.com/sienaskitchen" target="_blank" rel="noreferrer">
            <span class="icon-circle is-small" aria-hidden="true"><i data-lucide="instagram"></i></span>
            Instagram
          </a>
        </div>
        <div class="footer-links">
          <p class="footer-title">Legal</p>
          <a href="./privacy.html">Privacy &amp; Cookies</a>
          <a href="./advertising.html">Advertising disclosure</a>
        </div>
      </div>
    </footer>

    <div id="cookOverlay" class="cook-overlay" aria-hidden="true">
      <div class="cook-overlay__backdrop" data-action="close-cook"></div>
      <div class="cook-overlay__panel" role="dialog" aria-modal="true" aria-label="Let's cook">
        <div class="cook-overlay__bar">
          <div class="cook-overlay__title">
            <p class="section-kicker">Let's cook</p>
            <strong>Step-by-step cooking view</strong>
          </div>
          <div class="cook-overlay__nav">
            <button class="button button-ghost" type="button" data-action="cook-prev" id="cookPrev">
              Prev
            </button>
            <button class="button" type="button" data-action="cook-next" id="cookNext">
              Next
            </button>
            <button
              class="button button-ghost cook-overlay__close"
              type="button"
              data-action="close-cook"
            >
              Close
            </button>
          </div>
        </div>
        <div id="cookOverlayContent" class="cook-overlay__content"></div>
      </div>
    </div>
    <script src="./ads.js" defer></script>
  </body>
</html>
