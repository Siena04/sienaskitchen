<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Siena's camping recipes for the campfire, camp stove and breakfast at the campsite." />
    <title>Camping Recipes | Siena's Kitchen</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./camping.css" />
    <link rel="stylesheet" href="./footer-style.css" />
    <link rel="stylesheet" href="./recipe-header.css" />
    <script src="./recipe-header.js" defer></script>
    <script src="./footer.js" defer></script>
  </head>
  <body data-page="camping">
    <div class="page-shell">
      <header class="site-header shared-site-header">
        <a href="./index.html" class="brand-name">Siena's Kitchen</a>
      </header>
      <a class="journal-back" href="./index.html" data-site-back aria-label="Back to Home">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5m6-6-6 6 6 6" />
        </svg>
      </a>
      <main class="camping-main">
        <h1>Camping recipes</h1>
        <section aria-labelledby="campfire-heading">
          <h2 id="campfire-heading">By the campfire</h2>
          <a class="camping-feature" href="./recipe-library.html?recipe=campfire-quesadilla">
            <img src="./uploads/campfire-quesadilla-by-the-fire.jpg" alt="A foil-wrapped quesadilla held beside the campfire" />
            <div class="camping-feature-copy">
              <h3>Campfire Quesadilla</h3>
              <span>View recipe</span>
            </div>
          </a>
        </section>
        <section aria-labelledby="campsite-heading">
          <h2 id="campsite-heading">Easy campsite meals</h2>
          <div class="camping-recipes">
            <a class="camping-card" href="./recipe-library.html?recipe=miso-edamame-risoni">
              <img src="./uploads/recovered-miso-edamame-risoni.jpg" alt="" loading="lazy" />
              <div>
                <h3>Miso edamame risoni</h3>
                <p>One pot on the camp stove</p>
              </div>
            </a>
            <a class="camping-card" href="./recipe-library.html?recipe=cinnamon-protein-granola">
              <img src="./uploads/recovered-cinnamon-protein-granola.jpg" alt="" loading="lazy" />
              <div>
                <h3>Cinnamon protein granola</h3>
                <p>Make-ahead breakfast</p>
              </div>
            </a>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
